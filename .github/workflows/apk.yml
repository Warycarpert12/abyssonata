# APK для Android (Capacitor): весь сайт и звуки — внутри приложения, интернет не нужен.
# Запуск: вручную (Actions → apk → Run workflow) или тегом v* — тогда APK ещё и выкладывается в Releases
name: apk
on:
  workflow_dispatch:
  push: { tags: ['v*'] }
permissions: { contents: write }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Проверка публикуемого текста
        run: node tools/check_publish.mjs --all
      - run: python3 build_site.py
      - name: Capacitor → проект Android
        run: |
          npm init -y > /dev/null
          npm i @capacitor/core @capacitor/cli @capacitor/android
          # имя на телефоне — Abyssonata; идентификатор приложения прежний (иначе телефон считает его другим приложением)
          npx cap init "Abyssonata" io.github.warycarpert12.oceanmurmur --web-dir _site
          npx cap add android
          # океан задуман горизонтальным и на весь экран
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          sed -i 's|\(<style name="AppTheme.NoActionBar"[^>]*>\)|\1<item name="android:windowFullscreen">true</item>|' android/app/src/main/res/values/styles.xml
          npx cap sync android
      # release-сборка, подписанная постоянным ключом из секретов репозитория: обновления ставятся поверх прежней версии
      - name: Сборка и подпись
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "Нет секрета KEYSTORE_BASE64 — подписать APK нечем"; exit 1; }
          (cd android && ./gradlew assembleRelease --no-daemon -q)
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD --out Abyssonata.apk "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/release.jks"
          "$BT/apksigner" verify --print-certs Abyssonata.apk | grep -i "SHA-256"
      - uses: actions/upload-artifact@v4
        with: { name: Abyssonata-apk, path: Abyssonata.apk }
      - if: startsWith(github.ref, 'refs/tags/')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: >
          gh release create "${{ github.ref_name }}" Abyssonata.apk --title "Abyssonata ${{ github.ref_name }}"
          --notes "APK для Android (интернет не нужен). Установка: скачать Abyssonata.apk на телефон, открыть, разрешить установку из этого источника."
